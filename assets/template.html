<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>רשימת קניות</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:18px/1.35 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f4f2;color:#1a1a1a;padding-bottom:40px}
header{position:sticky;top:0;background:#1f6f43;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
header h1{font-size:20px;margin:0}
#count{font-weight:700}
.bar{height:4px;background:#cfe3d6}.bar i{display:block;height:100%;background:#7ed49c;width:0;transition:width .2s}
section{margin:12px 10px;background:#fff;border-radius:12px;overflow:hidden}
h2{font-size:15px;margin:0;padding:10px 14px;background:#eef3ef;color:#1f6f43;display:flex;justify-content:space-between}
label{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid #eee;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{width:24px;height:24px;accent-color:#1f6f43;flex:none}
.q{font-weight:700;color:#1f6f43;min-width:1.5em}
.n{color:#666;font-size:14px}
label.done{opacity:.4}label.done span{text-decoration:line-through}
.m{margin-inline-start:auto;flex:none;border:1px solid #c33;color:#c33;background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:14px}
label.miss{background:#fdecec}label.miss .m{background:#c33;color:#fff}label.miss span{color:#a22}
section.all h2{color:#888}
#wa{background:#25d366;border:0;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:14px;font-weight:700}
#reset{background:none;border:1px solid #fff9;color:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:14px}
</style>
</head>
<body>
<header><h1>🛒 קניות</h1><span id="count"></span><button id="wa">📤 וואטסאפ</button><button id="reset">איפוס</button></header>
<div class="bar"><i id="prog"></i></div>
<main id="list"></main>
<script>
const data=/*DATA*/{};
const K="shop-/*DATE*/",st=JSON.parse(localStorage.getItem(K)||"{}");
const list=document.getElementById("list");
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
let ver=-1,pend=0;
const save=()=>localStorage.setItem(K,JSON.stringify(st));
function sync(s,post){
 if(!s||(pend&&!post))return;
 if(ver===-1&&s.v===0&&Object.keys(st).length){ver=0;return api({seed:st})}
 if(s.v===ver)return;ver=s.v;
 for(const k in st)delete st[k];Object.assign(st,s.st);save();render();
}
function api(b){
 if(b)pend++;
 return fetch("state",b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{cache:"no-store"})
  .then(r=>r.ok?r.json():null).then(s=>{if(b)pend--;sync(s,!!b)}).catch(()=>{if(b)pend--});
}
function setItem(id,v){v?st[id]=v:delete st[id];save();api({id,v})}
function render(){
 list.innerHTML="";let tot=0,done=0,miss=0;
 for(const[cat,items]of Object.entries(data)){
  const s=document.createElement("section");let d=0;
  const rows=items.map(([q,name,note])=>{const id=cat+name;tot++;if(st[id]===1){done++;d++}if(st[id]===2)miss++;return{q,name,note,id}});
  rows.sort((a,b)=>!!st[a.id]-!!st[b.id]);
  s.innerHTML=`<h2><span>${esc(cat)}</span><span>${d}/${items.length}</span></h2>`;
  if(items.every(i=>st[cat+i[1]]))s.className="all";
  for(const r of rows){
   const l=document.createElement("label");if(st[r.id]===1)l.className="done";if(st[r.id]===2)l.className="miss";
   l.innerHTML=`<input type="checkbox"${st[r.id]===1?" checked":""}><span class="q">${esc(r.q)}</span><span>${esc(r.name)}${r.note?` <span class="n">(${esc(r.note)})</span>`:""}</span><button class="m">${st[r.id]===2?"חסר ✕":"חסר"}</button>`;
   l.querySelector("input").onchange=e=>{setItem(r.id,e.target.checked?1:0);setTimeout(render,250)};
   l.querySelector(".m").onclick=e=>{e.preventDefault();setItem(r.id,st[r.id]===2?0:2);render()};
   s.appendChild(l);
  }
  list.appendChild(s);
 }
 document.getElementById("count").textContent=`${done}/${tot}`+(miss?` · חסר ${miss}`:"");
 document.getElementById("prog").style.width=(done/tot*100)+"%";
}
document.getElementById("reset").onclick=()=>{if(confirm("לאפס את כל הסימונים?")){for(const k in st)delete st[k];save();render();api({reset:true})}};
document.getElementById("wa").onclick=()=>{
 let t=[],b=0,n=0,m=0;
 for(const[cat,items]of Object.entries(data)){
  t.push("","*"+cat+"*");
  for(const[q,name,note]of items){const v=st[cat+name];n++;v===1?b++:v===2&&m++;
   t.push((v===1?"✅ ":v===2?"❌ ":"⬜ ")+(q?q+" ":"")+name+(note?" ("+note+")":"")+(v===2?" - חסר":""))}
 }
 t.unshift("🛒 רשימת קניות: נקנו "+b+"/"+n+(m?", חסרים "+m:""));
 if(location.protocol.startsWith("http"))t.push("","🔗 לרשימה המשותפת: "+location.origin+location.pathname);
 location.href="https://wa.me/?text="+encodeURIComponent(t.join("\n"));
};
render();api();setInterval(()=>{if(!document.hidden)api()},1000);
</script>
</body>
</html>
